[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fecreator"
version = "0.1.0"
description = "Local-first Fire Emblem portrait creation workbench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "laqieer" }]
dependencies = [
  "fastapi>=0.115,<0.140",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<0.52",
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5.1",
  "Pillow>=11.0,<13",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<0.29",
  "build>=1.2,<2",
  "mypy>=1.13,<3",
  "hatchling>=1.25,<2",
  "pyyaml>=6,<7",
  "ruff>=0.11,<0.16",
  "pre-commit>=4,<5",
  "ggshield>=1.52,<2",
  # numpy 2.5+ bundles stubs using PEP 695 `type X = Y` syntax (Python 3.12+),
  # which mypy cannot parse under python_version = "3.11".  Pin to <2.5 in dev
  # so the installed stubs are Python-3.11-compatible without any shim.
  # The production dependency numpy>=2.1,<3 is unaffected at runtime.
  "numpy>=2.1,<2.5",
]

[project.scripts]
fecreator = "fecreator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fecreator"]

[tool.hatch.build]
# Hatchling discards *every* VCS ignore pattern when the project root itself
# matches one of them, which is exactly what a linked worktree under
# `.worktrees/` looks like.  The generated frontend bundle would then be picked
# up by normal file selection *and* by the force-include tables below, and the
# wheel build fails with "A second file is being added to the wheel archive at
# the same path".  Packaging exclusions are therefore stated explicitly so a
# clone and a worktree produce the same archives.
#
# `skip-excluded-dirs` keeps excluded directories out of the file walk itself.
# Without it the npm workspace link `node_modules/@laqieer/fecreator-web` is
# visited first and claims the identity of `web/`, so hatchling's loop
# detection then silently drops the real `web/` sources from the sdist.
skip-excluded-dirs = true
exclude = [
  "/src/fecreator/_web",
  "node_modules",
  "/.worktrees",
  "/.superpowers",
  "/.playwright-mcp",
  "/.venv",
  "/build",
  "/data",
  "/web/dist-demo",
  "/web/.e2e-data",
  "/web/playwright-report",
  "/web/test-results",
  "/.pytest-build-probe-*",
  "/.pytest-editable-probe-*",
  "/.pytest-package-probe-*",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "*.egg-info",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"src/fecreator/_web" = "fecreator/_web"

[tool.hatch.build.targets.sdist.force-include]
"src/fecreator/_web" = "src/fecreator/_web"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fecreator.imaging.*", "fecreator.specs.*", "fecreator.assets.portrait.*"]
warn_return_any = false
