[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fecreator"
version = "0.1.0"
description = "Local-first Fire Emblem portrait creation workbench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "laqieer" }]
dependencies = [
  "fastapi>=0.115,<0.140",
  "uvicorn[standard]>=0.30,<0.52",
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5.1",
  "Pillow>=11.0,<13",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<0.29",
  "build>=1.2,<2",
  "mypy>=1.13,<3",
  "hatchling>=1.25,<2",
  "ruff>=0.11,<0.16",
]

[project.scripts]
fecreator = "fecreator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fecreator"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"src/fecreator/_web" = "fecreator/_web"

[tool.hatch.build.targets.sdist.force-include]
"src/fecreator/_web" = "src/fecreator/_web"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# stubs/ contains a Python-3.11-compatible numpy shim that shadows the numpy 2.x
# bundled stubs (which use PEP 695 `type` syntax requiring python_version >= 3.12).
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fecreator.imaging.*", "fecreator.specs.*", "fecreator.assets.portrait.*"]
warn_return_any = false
