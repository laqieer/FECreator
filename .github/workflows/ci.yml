name: CI

on:
  # Secret scanning must cover pushes to ALL branches, so the full CI matrix
  # (including the secret-scan job) intentionally runs on every branch push.
  # This is a deliberate cost trade-off; deploy-pages stays gated to main below.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run -w @laqieer/fecreator-web typecheck
      - run: npm run -w @laqieer/fecreator-web lint
      - run: npm run -w @laqieer/fecreator-web test
      - run: npm run -w @laqieer/fecreator-web build
      - name: Verify the local build emits root-relative assets
        run: |
          grep -q '"/assets/' src/fecreator/_web/index.html
          if grep -q '/FECreator/' src/fecreator/_web/index.html; then
            echo "Local build must not use the demo base path"; exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run -w @laqieer/fecreator-web build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install twine
      - run: python -m build
      - run: twine check dist/*
      - name: Prove the distributions carry the frontend exactly once
        run: pytest -q tests/test_package.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the local and demo browser flows
        env:
          # Quoted so an interpreter path containing spaces still starts the
          # Playwright webServer, on POSIX shells and on Windows alike.
          FECREATOR_PYTHON: '"${{ steps.python.outputs.python-path }}"'
        run: npm run -w @laqieer/fecreator-web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # `trace: "retain-on-failure"` writes into Playwright's default
          # outputDir, so this is where failure diagnostics actually land.
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  febuilder-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Deterministic file-based compatibility evidence
        run: >-
          pytest -q
          tests/interop/test_febuilder_roundtrip.py
          tests/interop/test_febuilder_cli.py
          tests/reporting/test_bundle.py
      - name: Configured external executable check
        # Opt in by setting the FEBUILDER_CLI repository variable to an
        # executable path.  The check stays file-based: a nonzero exit fails
        # this job, and no ROM is ever required, downloaded, or referenced.
        if: ${{ vars.FEBUILDER_CLI != '' }}
        env:
          FEBUILDER_CLI: ${{ vars.FEBUILDER_CLI }}
        run: pytest -q tests/interop/test_febuilder_cli_smoke.py

  secret-scan:
    # Runs on pushes and on internal (same-repo) pull requests, where the
    # GITGUARDIAN_API_KEY secret is available.  Fork pull requests are skipped
    # because GitHub does not expose repository secrets to them; those are
    # covered by the GitGuardian GitHub App / dashboard scanning layer instead.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure GitGuardian API key is configured
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY secret is not set for this repository."
            echo "Add it with: gh secret set GITGUARDIAN_API_KEY --repo laqieer/FECreator"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitGuardian ggshield scan
        uses: GitGuardian/ggshield-action@da20be06cafe5e8633dc24744efe1efe8d30f06b
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  deploy-pages:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [python, web, browser, package, febuilder-interop, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run -w @laqieer/fecreator-web build:demo
      - name: Verify the demo build emits /FECreator/ assets
        run: |
          grep -q '"/FECreator/assets/' src/fecreator/_web/index.html
          if grep -q '"/assets/' src/fecreator/_web/index.html; then
            echo "Demo build must use the /FECreator/ base path"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/fecreator/_web
      - id: deployment
        uses: actions/deploy-pages@v4
